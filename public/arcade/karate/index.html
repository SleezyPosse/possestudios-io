<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
  /* every colour here is lifted straight out of his dojo palette */
  :root{ --void:#17110C; --paper:#EEC39A; --sour:#D9A066; --bad:#B73434; --dim:#8A7A6A; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--void);
            touch-action:none;-webkit-user-select:none;user-select:none;
            -webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  #stage{display:flex;flex-direction:column;align-items:center}
  canvas{image-rendering:pixelated;display:block}
  /* hud lives OUTSIDE the canvas: nothing is reserved inside the 160x288, and
     the strike can never cover the button no matter how the paw is drawn. */
  #hud{font-family:ui-monospace,Menlo,monospace;color:var(--paper);
       letter-spacing:.06em;padding-top:.45em;width:100%}
  #hud .row{display:flex;justify-content:space-between;font-size:.74em;color:var(--dim)}
  /* the readout IS the meme -- it gets the biggest type on the page */
  #read{font-size:1.4em;text-align:center;line-height:1.2;padding:.15em 0 .05em;
        min-height:2.3em;display:flex;flex-direction:column;justify-content:center}
  #cmp{color:var(--paper)}
  #delta{font-size:1.25em;color:var(--sour)}
  #delta.miss{color:var(--bad)}
  #say{text-align:center;min-height:1.5em;font-size:.8em;color:var(--dim);
       display:flex;align-items:center;justify-content:center;letter-spacing:.1em}

  /* ── THE BUTTON ──────────────────────────────────────────────────────────
     🔴 it must show NOTHING between your two taps. no fill, no pulse, no
     lingering pressed state -- any of that is a clock and deletes the game.
     the ONLY thing it ever does is knock: a 130ms invert at the instant the
     strike lands. on boards 1-2 that knock fires by itself, and that is the
     entire teach -- your hand feels the gap between your tap and the knock. */
  #hitbtn{display:block;width:100%;margin-top:.15em;font:inherit;font-size:1.05em;
          letter-spacing:.24em;padding:.62em 0;background:none;color:var(--paper);
          border:2px solid var(--paper);cursor:pointer;
          transition:none}          /* NO transition: an easing curve is a clock */
  #hitbtn.knock{background:var(--paper);color:var(--void)}
  #hitbtn:disabled{opacity:.34;cursor:default}

  #veil{position:fixed;inset:0;background:#17110CF2;display:flex;align-items:center;
        justify-content:center;text-align:center;font-family:ui-monospace,Menlo,monospace;
        color:var(--paper);padding:24px}
  #veil.off{display:none}
  .card{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:310px}
  .card h1{font-size:24px;font-weight:400;letter-spacing:.14em;color:var(--sour)}
  .card p{font-size:13px;line-height:1.7;opacity:.75}
  .card p b{color:var(--sour);font-weight:400}
  .card button{font:inherit;font-size:14px;background:none;color:var(--paper);
               border:2px solid var(--paper);padding:9px 22px;cursor:pointer;letter-spacing:.1em}
  .card button:active{background:var(--paper);color:var(--void)}
